\":\"month\",\"features\":[\"30 documents/month\",\"Up to 60 recipients\",\"12,000 monthly tokens\",\"Basic protection + watermark\",\"5 leak checks/month\",\"90-day retention\"]},\"liteBadge\":\"Great to get started\",\"liteTagline\":\"For those starting to protect their documents\",\"addonsTeaser\":\"Extra features for businesses: security reports, white-label, dedicated SLA and more.\",\"addonsViewAll\":\"View add-ons \u0026 plans\"},\"socialProof\":{\"badge\":\"Trusted Platform\",\"title\":\"Numbers that speak for themselves\",\"subtitle\":\"Thousands of professionals and companies already protect their most sensitive documents with Trace Documents.\",\"documents\":{\"label\":\"Documents protected\"},\"downloads\":{\"label\":\"Downloads tracked\"},\"users\":{\"label\":\"Active users\"},\"leakChecks\":{\"label\":\"Leak checks performed\"}},\"testimonials\":{\"badge\":\"Testimonials\",\"title\":\"Trusted by the people who use it\",\"subtitle\":\"Real stories from teams already protecting documents with Trace Documents.\",\"items\":[]},\"deterrence\":{\"badge\":\"Why Protect?\",\"title\":\"Why protect your documents?\",\"subtitle\":\"Data breaches cost millions and most involve the human element. But when recipients know sharing is traceable, behavior changes — and risk plummets.\",\"tracking\":{\"stat\":\"87%\",\"text\":\"Reduction in unauthorized sharing when recipients know the document is being tracked.\",\"source\":\"Behavioral deterrence studies\"},\"sharing\":{\"stat\":\"68%\",\"text\":\"Of data breaches involve the human element — accidental sharing, errors, or social engineering.\",\"source\":\"Verizon DBIR 2024\"},\"losses\":{\"stat\":\"$$4.88M\",\"text\":\"Average cost of a data breach worldwide — and the number keeps rising every year.\",\"source\":\"IBM Cost of a Data Breach 2024\"},\"deterrence\":{\"stat\":\"94%\",\"text\":\"Of recipients avoid forwarding documents when they know they can be identified.\",\"source\":\"Surveillance deterrence research\"},\"detection\":{\"stat\":\"194 days\",\"text\":\"Average time for a company to identify and contain a data breach — months of silent exposure.\",\"source\":\"IBM Cost of a Data Breach 2024\"},\"insider\":{\"stat\":\"60%\",\"text\":\"Of breaches originate internally — employees, former staff, or partners with legitimate access.\",\"source\":\"Verizon DBIR 2024\"},\"compliance\":{\"stat\":\"$$20M\",\"text\":\"Maximum GDPR fine per violation — plus incalculable reputational damage for the company.\",\"source\":\"General Data Protection Regulation (GDPR)\"},\"rising\":{\"stat\":\"10%\",\"text\":\"Year-over-year increase in average breach costs — the problem is accelerating, not slowing down.\",\"source\":\"IBM Cost of a Data Breach 2024\"}},\"proof\":{\"badge\":\"Proof\",\"title\":\"From leak to identity\",\"subtitle\":\"Every copy carries a unique fingerprint. When the file leaks, you know who redistributed it.\",\"steps\":{\"leak\":{\"eyebrow\":\"01 — Leak\",\"title\":\"The file shows up where it shouldn't\",\"description\":\"A group chat, external email, or public dump. The copy looks generic — it isn't.\"},\"scan\":{\"eyebrow\":\"02 — Analysis\",\"title\":\"You upload the file (or a photo of the screen)\",\"description\":\"Our analysis recovers the fingerprint even from screenshots and monitor photos.\"},\"identify\":{\"eyebrow\":\"03 — Identity\",\"title\":\"The recipient is identified\",\"description\":\"Name, email, and forensic evidence — so you can act with confidence.\"}}},\"stickyBar\":{\"text\":\"Protect your documents today\",\"cta\":\"Start free\"},\"guarantee\":\"7-day money-back guarantee\",\"saveBadge\":\"Save 20%\",\"enterpriseTeaser\":{\"badge\":\"Enterprise\",\"title\":\"Flexibility for demanding organizations\",\"subtitle\":\"Choose how to deploy: managed SaaS, bring your own storage (BYOS), cloud integrations, or dedicated environment.\",\"bullet1\":\"Your files in your storage (S3, Azure, GCS) — roadmap\",\"bullet2\":\"API, SSO/SAML, and dedicated SLA\",\"bullet3\":\"Custom onboarding and tailored plans\",\"cta\":\"View enterprise options\"},\"faq\":{\"badge\":\"FAQ\",\"title\":\"Frequently Asked Questions\",\"q1\":{\"question\":\"How does document fingerprinting work?\",\"answer\":\"Each copy of your document receives a unique, invisible fingerprint tied to a specific recipient. If the document leaks, you can trace exactly who shared it.\"},\"q2\":{\"question\":\"Are my documents stored on your servers?\",\"answer\":\"Yes — the original is uploaded and stored encrypted at rest (AES-256), the same on the website, mobile apps, and Windows client. Fingerprinted copies live in delivery storage for the recipient; the creator does not download or keep the unique copy on their PC. You can delete files at any time.\"},\"q3\":{\"question\":\"Can I cancel my subscription anytime?\",\"answer\":\"Yes. You can upgrade, downgrade, or cancel anytime. Monthly plans have no commitment. Annual plans include a 7-day money-back guarantee.\"},\"q4\":{\"question\":\"What types of documents are supported?\",\"answer\":\"We support PDF, JPG, and PNG (including image albums). Each format gets multiple invisible fingerprint layers — metadata, structural, and steganographic — based on the protection level you choose.\"},\"q5\":{\"question\":\"Is it compliant with LGPD and GDPR?\",\"answer\":\"Yes. We are LGPD-compliant and follow GDPR best practices. All data is encrypted in transit (TLS 1.3) and at rest (AES-256). We offer data export and deletion on request.\"},\"q6\":{\"question\":\"Will the recipient notice the document is marked?\",\"answer\":\"No. The marking is invisible and does not change the appearance or reading experience. Recipients see the file normally — protection is embedded imperceptibly.\"},\"q7\":{\"question\":\"Does it work if someone prints, scans, or screenshots the document?\",\"answer\":\"Yes — via the visual-mark channel: QR (Standard+) and the visible serial code (Basic+), with OCR when the photo is readable. Metadata and digital steganography alone do not survive a screen photo. With an account, upload the PDF or photo in Leak check (signed-in app) to identify the recipient.\"},\"q8\":{\"question\":\"Can the result be used as legal evidence?\",\"answer\":\"The identification report technically documents the match between the leaked copy and the original recipient, and can support expert analysis as evidence. It does not guarantee automatic legal validity — that depends on context and case review.\"}},\"cta\":{\"title\":\"Ready to regain control of your documents?\",\"subtitle\":\"Protect your first file for free or explore options for teams and companies.\"},\"footer\":{\"copyright\":\"© {year} Trace Documents. All rights reserved.\",\"since\":\"Since March 2026\",\"sinceTitle\":\"Project first commit: March 4, 2026\",\"version\":\"Version {version}\",\"privacy\":\"Privacy Policy\",\"terms\":\"Terms of Use\",\"contact\":\"Contact\",\"about\":\"About the creator\",\"description\":\"A document protection and traceability platform for organizations that take information security seriously.\",\"productTitle\":\"Product\",\"companyTitle\":\"Company\",\"contactTitle\":\"Contact\",\"product\":{\"features\":\"Features\",\"howItWorks\":\"How It Works\",\"pricing\":\"Pricing\",\"pricingPage\":\"Pricing\",\"apps\":\"Apps\",\"appsNote\":\"Mobile apps — coming soon\",\"tipsNewsletter\":\"Tips \u0026 Newsletter\",\"examples\":\"Examples\",\"transparency\":\"Transparency\",\"enterprise\":\"Enterprise\"},\"cnpj\":\"CNPJ {cnpj}\",\"whatsappAria\":\"Chat on WhatsApp\",\"whatsappPrefill\":\"Hi! I came from the Trace Documents website and would like more information.\",\"social\":{\"linkedin\":\"Trace Documents on LinkedIn\",\"instagram\":\"Trace Documents on Instagram\"}}},\"downloadPage\":{\"eyebrow\":\"Apps\",\"title\":\"Download Trace Documents\",\"intro\":\"The Windows client protects and sends through the same API as the website: the original is uploaded encrypted and unique copies are generated on our servers. You do not keep the fingerprinted copy on your PC.\",\"cloudNote\":\"Downloading the Windows installer records an encrypted IP, country, and version for up to 6 months to count installs — not to trace documents.\"},\"privacyPage\":{\"title\":\"Privacy Policy\",\"updatedAt\":\"Last updated: August 14, 2026\",\"tocTitle\":\"Contents\",\"intro\":\"Trace Documents respects your privacy and protects your personal data in accordance with the Brazilian General Data Protection Law (LGPD — Law 13,709/2018) and other applicable regulations. This policy describes what data we collect, how we use it, who we share it with, and your rights as a data subject.\",\"sections\":{\"collectionTitle\":\"1. Data we collect\",\"collectionBody\":\"We collect: (a) account data — name, email, password hash, tax ID (optional); (b) usage data — uploaded documents, generated fingerprints, access logs, notification preferences; (c) technical data — IP address (encrypted), browser user agent, cookies; (d) payment data — MercadoPago/Stripe transaction IDs, amounts, payment method (we do not store card data directly); (e) Windows installer telemetry — encrypted IP, user agent, approximate country/city, setup version and hash, for up to 6 months, to count app downloads (not mixed with forensic document logs).\",\"usageTitle\":\"2. How we use data\",\"usageBody\":\"We use your data for: (a) authentication and account management (legal basis: contract performance); (b) fingerprint generation and document protection (contract); (c) leak detection (legitimate interest); (d) payment processing and invoice generation (legal obligation/contract); (e) transactional notifications and, when authorized, marketing communications (consent); (f) aggregated, anonymous usage analysis for service improvement (legitimate interest); (g) security auditing and fraud prevention (legal obligation).\",\"sharingTitle\":\"3. Data sharing\",\"sharingBody\":\"We do not sell personal data. We share information only with: (a) payment processors — MercadoPago and Stripe, to process transactions; (b) cloud infrastructure — Microsoft Azure, for hosting and storage; (c) email service — SendGrid, for notification delivery; (d) competent authorities — when required by law or court order. All third parties operate under Data Processing Agreements (DPA) compliant with LGPD.\",\"retentionTitle\":\"4. Data retention\",\"retentionBody\":\"We apply differentiated retention periods: protected documents per the contracted plan (30 to 365 days); audit logs for 2 years (compliance); payment and invoice data for 5 years (tax obligation), including after voluntary account deletion (records detached from the account holder); access logs (IP, user agent) for 6 months; Windows installer download events (encrypted IP, version, country) for 6 months; inactive accounts for 2 years, then anonymized. Voluntary deletion includes a 7-day grace period before permanent erasure. Anonymized data may be kept indefinitely for aggregate statistics.\",\"rightsTitle\":\"5. Your rights\",\"rightsBody\":\"You have the right to: access and export your data (portability); correct incomplete or inaccurate information; request deletion of your data (right to be forgotten); revoke consents at any time; request information about third-party sharing; request anonymization or blocking of unnecessary data. To delete your account: Settings → Delete account (web) or Profile → Delete account (app), or the public page /delete-account. After requesting, your account is locked; permanent deletion occurs after 7 days. We respond within 15 days (LGPD Art. 18 §5). Contact the DPO for questions.\",\"cookiesTitle\":\"6. Cookies\",\"cookiesBody\":\"We use essential cookies for platform operation (authentication, session). Non-essential cookies — analytics and marketing, including the Google Ads tag to measure ads and conversions — are activated only with your explicit consent in the cookie banner (Accept all or the Marketing preference).\",\"securityTitle\":\"7. Security\",\"securityBody\":\"We implement technical and organizational measures: encryption in transit (TLS 1.2+) and at rest (AES-256); password hashing with bcrypt; IP encryption in audit logs with rotatable keys; role-based access control (RBAC); automated security monitoring and alerts; multi-factor authentication (MFA); security testing (SAST, DAST, dependency scanning).\",\"childrenTitle\":\"8. Children\",\"childrenBody\":\"Trace Documents is not intended for users under 18 years of age. We do not intentionally collect data from minors. If we learn that a minor's data has been collected, it will be deleted immediately.\",\"changesTitle\":\"9. Changes to this policy\",\"changesBody\":\"We may update this policy periodically. Significant changes will be communicated via email or platform notification. Continued use of the service after changes constitutes acceptance of the new version.\"},\"dpoTitle\":\"Data Protection Officer (DPO)\",\"dpoBody\":\"Our Data Protection Officer is available to answer questions about personal data processing and to receive requests to exercise your rights.\",\"dpoLink\":\"View DPO contact information →\",\"deleteAccountLink\":\"How to delete account and data →\",\"contact\":\"Privacy inquiries: {dpoEmail} | Data Protection Officer appointed per applicable law.\",\"contactNoEmail\":\"Privacy inquiries: use the DPO page | Data Protection Officer appointed per applicable law.\",\"contactLabels\":{\"dpoEmail\":\"DPO email\",\"phone\":\"Phone\",\"address\":\"Address\"}},\"deleteAccountPage\":{\"title\":\"Delete account and personal data\",\"updatedAt\":\"Last updated: May 22, 2026\",\"intro\":\"This page explains how to request deletion of your Trace Documents account (LGPD — right to erasure). Use the same flow on web, in the mobile app, or after signing in.\",\"howTitle\":\"How to request\",\"howStep1\":\"Sign in to your account (web or app).\",\"howStep2\":\"Open Settings (web) or Profile (mobile app).\",\"howStep3\":\"Tap Delete account and confirm both steps.\",\"webCta\":\"Open settings (web)\",\"loginCta\":\"Sign in to delete\",\"mobileTitle\":\"Mobile app (Android / iOS)\",\"mobileBody\":\"In the Trace Documents app: Profile tab → Delete account. Same as web: request, immediate account lock, permanent deletion after 7 days.\",\"timelineTitle\":\"Timelines\",\"timelineGrace\":\"7 days — grace period after the request (account locked, no new sign-in).\",\"timelineSla\":\"Up to 15 days — maximum response time to your request (LGPD Art. 18 §5).\",\"timelineRetain\":\"Up to 5 years — payment and invoice records may be kept, detached from the account (tax law).\",\"dataTitle\":\"What is deleted vs. what may remain\",\"dataBody\":\"We delete documents, recipients, profile, tokens, and other product data. We may keep anonymized payment and invoice records for the tax retention period. See the privacy policy for details.\",\"contact\":\"Questions or email requests:\",\"dpoLink\":\"DPO contact\"},\"examples\":{\"backToHome\":\"Back to home\",\"hero\":{\"badge\":\"See it in action\",\"title\":\"See how your documents are protected\",\"subtitle\":\"Explore interactive examples of our fingerprinting technology. Each document receives unique, invisible marks that are impossible to remove.\"},\"sim\":{\"protected\":\"Protected\"},\"demo\":{\"badge\":\"Interactive Demo\",\"title\":\"Choose a protection level\",\"subtitle\":\"Select a level and see how fingerprint layers are applied to your document in real time.\",\"note\":\"In real documents, the fingerprints are completely invisible to the naked eye. Here they are exaggerated for demonstration.\",\"simNote\":\"Simplified simulation — actual fingerprints are invisible in the final document.\",\"levels\":{\"basic\":{\"name\":\"Basic\",\"description\":\"{count} techniques — QR code, metadata, invisible text, structure, and minimum visible watermark\"},\"advanced\":{\"name\":\"Advanced\",\"description\":\"{count} techniques — adds micro-text, micro-dots, color channels and more\"},\"maximum\":{\"name\":\"Maximum\",\"description\":\"{count} techniques — all layers including moiré patterns and spread spectrum\"}}},\"catalog\":{\"badge\":\"Catalog\",\"title\":\"Technologies by category\",\"subtitle\":\"Three distinct questions: authenticity (serial) · integrity (hash) · attribution (leak check).\",\"tabs\":{\"integrity\":\"Integrity \u0026 authentication\",\"fingerprinting\":\"Fingerprinting \u0026 steganography\",\"detection\":\"Detection \u0026 verification\",\"distribution\":\"Distribution \u0026 compliance\"},\"status\":{\"active\":\"Active\",\"planned\":\"Coming soon\"},\"items\":{\"integrityCheck\":{\"title\":\"Integrity verification\",\"description\":\"Compare a received file against the registered SHA-256 hash of the protected copy.\"},\"sha256PerCopy\":{\"title\":\"SHA-256 hash per copy\",\"description\":\"Every generated copy gets a cryptographic fingerprint of the full file.\"},\"originalHash\":{\"title\":\"Original registration\",\"description\":\"Master file hash recorded at upload — INPI-style reference.\"},\"merkleTree\":{\"title\":\"Per-page Merkle tree\",\"description\":\"Page-level tamper detection via Merkle tree in metadata.\"},\"hmacSignature\":{\"title\":\"HMAC-SHA256 signature\",\"description\":\"Cryptographically signed fingerprints — identity cannot be forged.\"},\"serialCode\":{\"title\":\"Public serial code\",\"description\":\"Verify authenticity via TD-XXXXXX code without login.\"},\"perceptualHash\":{\"title\":\"Perceptual hash (SimHash)\",\"description\":\"Detects equivalent content after re-save or compression.\"},\"invisibleText\":{\"title\":\"Invisible text\",\"description\":\"Imperceptible typographic markers encoding recipient identity.\"},\"colorChannelSteg\":{\"title\":\"RGB steganography\",\"description\":\"Hidden data in color channels with minimal visual impact.\"},\"spreadSpectrum\":{\"title\":\"Spread spectrum\",\"description\":\"Frequency-distributed signal resistant to compression and resampling.\"},\"xrefShuffling\":{\"title\":\"Xref shuffling\",\"description\":\"Unique internal structure per copy — same visible content, different hash.\"},\"leakCheck\":{\"title\":\"Leak check\",\"description\":\"Upload → identify recipient in seconds.\"},\"leakMonitor\":{\"title\":\"Leak monitor\",\"description\":\"Continuous leak monitoring.\"},\"forensicReport\":{\"title\":\"Forensic report\",\"description\":\"Exportable evidence for compliance (Team+).\"},\"visualDiff\":{\"title\":\"Visual diff\",\"description\":\"Page-by-page comparison: original vs leaked (Team+).\"},\"expiringLinks\":{\"title\":\"Expiring links\",\"description\":\"Deadline and download limits per recipient.\"},\"geolocation\":{\"title\":\"Download geolocation\",\"description\":\"IP, city and device logged on every access.\"},\"aesEncryption\":{\"title\":\"AES-256 encryption at rest\",\"description\":\"Envelope encryption in blob storage.\"},\"virusScan\":{\"title\":\"Upload virus scan\",\"description\":\"Files scanned before processing.\"},\"antiAiPrompt\":{\"title\":\"Anti-AI prompt\",\"description\":\"Anti-extraction metadata for AI systems (Pro+).\"}}},\"techniques\":{\"badge\":\"Technologies\",\"title\":\"20+ protection layers\",\"subtitle\":\"Each technique adds an independent layer. Combined, they create robust forensic traceability per recipient.\",\"more\":\"Additional layers at Advanced and Maximum levels — steganography, content stream reorder, serial codes and more.\",\"items\":{\"qrCode\":{\"title\":\"Micro QR Code\",\"description\":\"Unique QR code per recipient, embedded at minimal size in strategic positions.\",\"visibility\":\"Nearly invisible (\u003c 0.5cm)\"},\"microText\":{\"title\":\"Micro-Text\",\"description\":\"Text at 1-2pt with the recipient identifier, distributed along margins and between paragraphs.\",\"visibility\":\"Invisible without magnification\"},\"microDot\":{\"title\":\"Micro-Dots\",\"description\":\"Sub-pixel dots in strategic positions encoding the unique fingerprint of each copy.\",\"visibility\":\"Invisible to the naked eye\"},\"metadata\":{\"title\":\"PDF Metadata\",\"description\":\"Hidden information in the document structure, internal headers and XMP properties.\",\"visibility\":\"Hidden in document properties\"},\"distributed\":{\"title\":\"Distributed Fingerprint\",\"description\":\"Fingerprint fragmented across multiple pages with redundancy for tamper resistance.\",\"visibility\":\"Distributed and redundant\"},\"moirePattern\":{\"title\":\"Moiré Pattern\",\"description\":\"Interference pattern in the document background that encodes unique data per copy.\",\"visibility\":\"Invisible on screen, detectable on scan\"}}},\"beforeAfter\":{\"badge\":\"Result\",\"title\":\"What changes in your document?\",\"items\":{\"invisible\":{\"title\":\"100% Invisible\",\"description\":\"Fingerprints do not alter the visual appearance or readability of the document.\"},\"unique\":{\"title\":\"Unique per recipient\",\"description\":\"Each downloaded copy has a unique combination of fingerprints.\"},\"traceable\":{\"title\":\"Fully traceable\",\"description\":\"If a copy leaks, we identify the exact recipient who received it.\"},\"tamperProof\":{\"title\":\"Tamper resistant\",\"description\":\"Multiple layers survive print, scan, screenshot and PDF conversion.\"}},\"before\":{\"title\":\"Before — Unprotected document\",\"status\":\"⚠ No protection — impossible to trace leaks\"},\"after\":{\"title\":\"After — Protected with Trace Documents\",\"badge\":\"Protected\",\"status\":\"✓ 20+ fingerprint layers — robust traceability\"}},\"shuffled\":{\"badge\":\"Shuffled copy\",\"title\":\"Same look, unique binary per recipient\",\"subtitle\":\"TraceDocuments reorders the PDF's internal structure (xref shuffling) on every copy. The visible content is identical, but the MD5 hash changes — making it impossible to identify the leak source from the file alone.\",\"tabs\":{\"original\":\"Original\",\"shuffled\":\"Shuffled\",\"diff\":\"Show difference\"},\"cards\":{\"originalLabel\":\"contract_v1.pdf · copy 001\",\"shuffledLabel\":\"contract_v1.pdf · copy 002\"},\"explain\":{\"original\":{\"title\":\"Original copy (reference)\",\"body\":\"This is the reference version of the document. Every copy delivered to a different recipient looks exactly like this — but with a unique binary structure.\"},\"shuffled\":{\"title\":\"Shuffled copy for another recipient\",\"body\":\"Same text, same layout, same page count. But the PDF internal objects were reordered, producing a completely different MD5. If this copy leaks, we know exactly who received it.\"},\"diff\":{\"title\":\"A difference nobody sees — except us\",\"body\":\"Side by side: visually identical, distinct MD5 hashes. No visual comparison tool (DiffPDF, screenshot) can tell these copies apart. Only binary inspection reveals it.\"}},\"extras\":{\"title\":\"Other visible layers available\",\"watermark\":{\"label\":\"contract_v1.pdf · watermark\",\"caption\":\"Visible watermark with recipient name\"},\"instructions\":{\"label\":\"contract_v1.pdf · notice\",\"caption\":\"Usage instructions and legal notice page\"},\"copyprotect\":{\"label\":\"contract_v1.pdf · no copy\",\"caption\":\"Protection against copy, print and selection\"}}},\"downloads\":{\"title\":\"Download sample PDFs\",\"subtitle\":\"Download and open each PDF — clean original, shuffled twin (same look), Basic with serial and minimum visible mark, Advanced with forensic watermark.\",\"button\":\"Download PDF\",\"items\":{\"original\":{\"title\":\"Original (reference)\",\"description\":\"Clean report with no protection marks — visual and hash baseline.\"},\"shuffled\":{\"title\":\"Shuffled copy\",\"description\":\"Same look as original, different MD5 (distinct internal structure).\"},\"basic\":{\"title\":\"Basic protection\",\"description\":\"Corner serial TD-…, minimum visible mark, and Basic badge (like the real pipeline).\"},\"advanced\":{\"title\":\"Advanced protection\",\"description\":\"Red banner, CONFIDENTIAL watermark, and Advanced serial.\"}}},\"cta\":{\"title\":\"Ready to protect your documents?\",\"subtitle\":\"Start free and protect your first documents in under 2 minutes.\",\"button\":\"Get Started Free\"}},\"brochure\":{\"ctaContact\":\"Contact us\",\"pausedTitle\":\"New sign-ups are temporarily paused\",\"pausedBody\":\"We are preparing the next phase of TraceDocuments. To talk about document protection for your company, reach us through the channels below.\"},\"contactPage\":{\"title\":\"Contact\",\"subtitle\":\"Our team is ready to help with sales, technical support and partnerships.\",\"channelsTitle\":\"Support channels\",\"infoTitle\":\"Information\",\"quickActionsTitle\":\"Quick actions\",\"quickActionsEmail\":\"Send email\",\"quickActionsTips\":\"View security tips\",\"channels\":{\"emailLabel\":\"Email\",\"salesLabel\":\"Phone\",\"whatsappLabel\":\"WhatsApp\",\"whatsappPrefill\":\"Hi! I came from the Trace Documents website and would like more information.\",\"supportLabel\":\"Support\"},\"officeTitle\":\"Address\",\"hoursTitle\":\"Business hours\",\"hours\":\"Monday to Friday, 9:00 AM - 6:00 PM (PST)\",\"form\":{\"title\":\"Send us a message\",\"subtitle\":\"Fill out the form below and we'll get back to you as soon as possible.\",\"name\":\"Name\",\"namePlaceholder\":\"Your full name\",\"email\":\"Email\",\"emailPlaceholder\":\"you@example.com\",\"subject\":\"Subject\",\"subjectPlaceholder\":\"How can we help?\",\"category\":\"Category\",\"categoryDefault\":\"Select a category\",\"categorySales\":\"Sales\",\"categorySupport\":\"Technical Support\",\"categoryPartnership\":\"Partnership\",\"categoryBilling\":\"Billing\",\"categoryOther\":\"Other\",\"enterprisePrefillSubject\":\"Enterprise plan inquiry\",\"enterprisePrefillMessage\":\"I would like to learn more about the Enterprise plan and deployment options (SaaS, BYOS, dedicated).\",\"message\":\"Message\",\"messagePlaceholder\":\"Describe your question or request in detail...\",\"submit\":\"Send message\",\"sending\":\"Sending...\",\"successTitle\":\"Message sent!\",\"successMessage\":\"Thank you for reaching out. Our team will respond within 1-2 business days.\",\"sendAnother\":\"Send another message\",\"errorGeneric\":\"Failed to send message. Please try again.\",\"errorNetwork\":\"Network error. Check your connection and try again.\",\"recaptchaNotice\":\"This form is protected by reCAPTCHA.\"}},\"termsPage\":{\"title\":\"Terms of Use\",\"updatedAt\":\"Last updated: April 5, 2026\",\"tocTitle\":\"Contents\",\"intro\":\"These Terms govern your use of Trace Documents. By creating an account or using the service, you agree to the conditions below. Please read carefully.\",\"sections\":{\"acceptableUseTitle\":\"1. Acceptable use\",\"acceptableUseBody\":\"You agree to use the platform only for lawful and authorized purposes. Prohibited activities include: abuse or reverse engineering attempts; uploading malware or unlawful content; unauthorized access to third-party accounts; automated use (scraping, bots) without express authorization.\",\"intellectualPropertyTitle\":\"2. Intellectual property\",\"intellectualPropertyBody\":\"The platform technology, brand, source code and components remain property of Trace Documents and its licensors. Your files and data remain yours — we claim no ownership over the content you upload.\",\"userContentTitle\":\"3. User content\",\"userContentBody\":\"You are responsible for the content you upload (website, mobile apps, or Windows client). By using the service, you grant us a limited license to process your documents on our servers (generate fingerprints, watermarks, encrypted storage) as necessary to provide the service — the Windows client does not generate the unique copy locally. This license terminates when you delete your data or close your account. Forensic protection and watermark processing do not remove the technical limitations described in section 6 — the license covers service delivery, not a guarantee of absolute traceability.\",\"dataProcessingTitle\":\"4. Personal data processing\",\"dataProcessingBody\":\"Personal data processing is carried out in accordance with the LGPD (Law 13,709/2018). Details about collection, usage, sharing and your rights are described in our Privacy Policy. By using the platform, you acknowledge that you have read and understood this policy. For specific consents (marketing, non-essential cookies), we use granular mechanisms with audit trails.\",\"liabilityTitle\":\"5. Limitation of liability\",\"liabilityBody\":\"Trace Documents applies strong security and availability practices, but cannot guarantee zero interruptions or failures. Our liability is limited to the amount paid for the service in the last 12 months, except in cases of intent or gross negligence, as permitted by applicable law.\",\"documentProtectionTitle\":\"6. Document protection, leaks and circumvention\",\"documentProtectionBody\":\"Trace Documents' protection techniques (watermarking, forensic fingerprinting, steganography and related methods) are designed to deter improper sharing and help identify the source of a leak — they do not physically prevent copying, photographing, printing or redistributing a document by someone who already had legitimate access to it, nor do they guarantee detection of every attempt to remove, tamper with or circumvent these marks. Responsibility for how content is used after delivery to the authorized recipient rests with the recipient, not with Trace Documents. By using the platform to protect and send documents, you acknowledge these technical limitations.\",\"terminationTitle\":\"7. Suspension and termination\",\"terminationBody\":\"We may suspend or terminate accounts in cases of misuse, Terms violations or legal requirements. You may close your account at any time in settings. After termination, your data will be processed according to the Data Retention Policy.\",\"jurisdictionTitle\":\"8. Governing law and jurisdiction\",\"jurisdictionBody\":\"These Terms are governed by the laws of the Federative Republic of Brazil. The courts of São Paulo — SP are elected as the exclusive jurisdiction for any disputes.\"},\"notice\":\"For legal or commercial questions about these Terms, contact {dpoEmail}. To exercise your rights as a data subject, visit the DPO page.\",\"noticeNoEmail\":\"For legal or commercial questions about these Terms, reach us via the Contact page. To exercise your rights as a data subject, visit the DPO page.\",\"dpoPageLink\":\"Open DPO page →\",\"contactLabels\":{\"dpoEmail\":\"DPO email\",\"contactEmail\":\"Email\",\"phone\":\"Phone\"}},\"dpoPage\":{\"title\":\"Data Protection Officer (DPO)\",\"intro\":\"In accordance with Art. 41 of the LGPD (Law 13,709/2018), Trace Documents has appointed a Data Protection Officer (DPO) responsible for accepting complaints and communications from data subjects and the ANPD, and guiding employees and contractors on data protection practices.\",\"emailLabel\":\"Email\",\"phoneLabel\":\"Phone\",\"addressLabel\":\"Address\",\"responsibilitiesTitle\":\"DPO Responsibilities\",\"responsibilitiesBody\":\"The Data Protection Officer is responsible for: accepting and processing complaints and communications from data subjects and the ANPD; providing clarifications and taking appropriate actions; guiding employees and contractors on data protection practices; performing other duties as determined by the controller or supplementary regulations.\",\"rightsTitle\":\"Your rights as a data subject\",\"rights\":{\"access\":\"Right of access — request and receive a copy of all your personal data\",\"correction\":\"Right of correction — request correction of incomplete, inaccurate or outdated data\",\"deletion\":\"Right of deletion — request the elimination of your personal data when applicable\",\"portability\":\"Right of portability — export your data in a structured format\",\"revocation\":\"Right of revocation — revoke previously granted consents at any time\",\"information\":\"Right to information — know with whom your data has been shared\"},\"howToExerciseTitle\":\"How to exercise your rights\",\"howToExerciseBody\":\"To exercise any of your rights, you can: (1) access your account settings on the platform; (2) send an email to {dpoEmail} identifying yourself and specifying your request; (3) send mail to the address above, when available. Response time is up to 15 days.\",\"howToExerciseBodyNoEmail\":\"To exercise any of your rights, you can: (1) access your account settings on the platform; (2) use the Contact page or DPO channels when available; (3) send mail to the address above, when available. Response time is up to 15 days.\",\"documentProtectionTitle\":\"Document protection vs. personal data protection\",\"documentProtectionBody\":\"The rights above concern processing of personal data (LGPD). The platform's document protection techniques (watermarking, fingerprinting, steganography) are technical measures to deter and help trace file leaks — they do not replace LGPD obligations, do not physically prevent every copy or capture, and do not guarantee 100% detection. Technical limitations are detailed in the Terms of Use (section 6).\",\"anpdNotice\":\"If you believe that your personal data processing violates the law, you may file a petition with the ANPD (National Data Protection Authority).\",\"legalRef\":\"LGPD — Law 13,709/2018 | Art. 41 — Data Protection Officer\"},\"aboutPage\":{\"eyebrow\":\"About the creator\",\"name\":\"Caio Fábio\",\"role\":\"Founder of TraceDocuments\",\"bioParagraphs\":[\"I'm a software engineer with a degree in Computer Science and MBAs in Software Engineering and Project Management from PUC Minas. I've spent the last few years building systems for tech companies and leading engineering projects — and also building startups, with a few attempts before this one.\",\"TraceDocuments came out of a problem I kept seeing: sensitive documents leak, and nobody can prove where they came from. I built the platform solo, from scratch, combining that technical background with the drive to actually solve it.\"],\"academicTitle\":\"Education\",\"academic\":[{\"school\":\"PUC Minas\",\"degree\":\"MBA in Project Management\",\"period\":\"2024 – 2025\"},{\"school\":\"PUC Minas\",\"degree\":\"MBA in Software Engineering\",\"period\":\"2023\"},{\"school\":\"UniBH\",\"degree\":\"B.Sc. in Computer Science\",\"period\":\"2016 – 2019\"}],\"experienceTitle\":\"Professional experience\",\"experience\":[{\"role\":\"Owner\",\"company\":\"Code Auto Soluções\",\"period\":\"2024 – 2025\"},{\"role\":\"Senior Software Engineer\",\"company\":\"Unio Digital\",\"period\":\"2023 – 2024\"},{\"role\":\"Senior Software Engineer\",\"company\":\"Ateliê de Software\",\"period\":\"2022\"},{\"role\":\"Senior Software Engineer\",\"company\":\"LYNX PROCESS\",\"period\":\"2020 – 2022\"},{\"role\":\"Co-owner\",\"company\":\"Sinótico Sistemas\",\"period\":\"2021\",\"highlight\":\"Took part in SEED MG 2021 — ranked 73rd out of 711 startups.\"},{\"role\":\"Software Engineer\",\"company\":\"Cataldi Bessa Consultoria\",\"period\":\"2018 – 2020\"}],\"photoAlt\":\"Photo of Caio Fábio, founder of TraceDocuments\"},\"tipsPage\":{\"title\":\"Protection Tips \u0026 Newsletter\",\"subtitle\":\"Practical guidance to protect digital documents, images and sensitive communications.\",\"cards\":{\"layeredMarks\":{\"title\":\"1. Use layered markings\",\"body\":\"Combine metadata, invisible text and visible watermarking to make removal harder and traceability stronger.\"},\"controlledDistribution\":{\"title\":\"2. Control distribution\",\"body\":\"Avoid uncontrolled public files. Prefer expiring links, download limits and per-recipient identifiers.\"},\"emailTracing\":{\"title\":\"3. Trace sensitive emails\",\"body\":\"Media reports have described cases where subtle text/spacing variations were used to identify unauthorized forwarding.\"},
